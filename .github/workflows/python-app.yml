# RPT YouTube - CI/CD Pipeline
# Build and Release Automation for YouTube Downloader
# Developer: Raptor96

name: RPT YouTube Build & Release

on:
  push:
    branches: [ "main", "develop" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  packages: write
  issues: write

env:
  APP_NAME: RPT_YouTube
  APP_VERSION: 3.0.0

jobs:
  # =============================================
  # JOB 1: Lint & Code Quality Check
  # =============================================
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pylint black isort
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Check imports with isort
      run: |
        isort --check-only --profile black *.py || true
    
    - name: Format check with Black
      run: |
        black --check *.py || true
    
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics
    
    - name: Lint with pylint
      run: |
        pylint *.py --exit-zero || true

  # =============================================
  # JOB 2: Build Windows EXE
  # =============================================
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    needs: lint
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if (Test-Path requirements.txt) { pip install -r requirements.txt }
    
    - name: Build with PyInstaller
      run: |
        python -m PyInstaller --onefile --windowed --name "RPT_YouTube" --icon assets/icon.ico --add-data "assets;assets" --hidden-import customtkinter --hidden-import PIL --hidden-import yt_dlp --hidden-import pygame --collect-all customtkinter RPT_YouTube_v3.py
    
    - name: Prepare Windows Package
      run: |
        New-Item -ItemType Directory -Path "RPT_YouTube_Portable" -Force
        Copy-Item "dist\RPT_YouTube.exe" "RPT_YouTube_Portable\"
        Copy-Item "assets" -Recurse -Destination "RPT_YouTube_Portable\assets" -Force
        New-Item -ItemType File -Path "RPT_YouTube_Portable\Run_RPT_YouTube.bat" -Value "@echo off`nstart "" ""%~dp0RPT_YouTube.exe`n"
    
    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RPT_YouTube_Windows
        path: RPT_YouTube_Portable/

  # =============================================
  # JOB 3: Build Linux DEB
  # =============================================
  build-linux:
    name: Build Linux DEB Package
    runs-on: ubuntu-latest
    needs: lint
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Build with PyInstaller
      run: |
        python -m PyInstaller --onefile --name "RPT_YouTube" --add-data "assets:assets" RPT_YouTube_v3.py
    
    - name: Create DEB Package Structure
      run: |
        mkdir -p rpt-youtube/DEBIAN
        mkdir -p rpt-youtube/usr/share/rpt-youtube
        mkdir -p rpt-youtube/usr/share/applications
        mkdir -p rpt-youtube/usr/bin
        
        # Control file
        cat > rpt-youtube/DEBIAN/control << EOF
        Package: rpt-youtube
        Version: 3.0.0
        Section: utils
        Priority: optional
        Architecture: all
        Depends: python3, python3-pip, ffmpeg
        Maintainer: Raptor96
        Description: RPT YouTube Downloader
         YouTube Video & Audio Downloader with Modern GUI
        EOF
        
        # Post-install script
        cat > rpt-youtube/DEBIAN/postinst << EOF
        #!/bin/bash
        echo "🎬 RPT YouTube v3.0.0 installed successfully!"
        echo "Run: rpt-youtube"
        EOF
        chmod 755 rpt-youtube/DEBIAN/postinst
        
        # Copy application files
        cp dist/RPT_YouTube rpt-youtube/usr/share/rpt-youtube/
        cp -r assets rpt-youtube/usr/share/rpt-youtube/
        
        # Desktop entry
        cat > rpt-youtube/usr/share/applications/rpt-youtube.desktop << EOF
        [Desktop Entry]
        Name=RPT YouTube
        Exec=/usr/share/rpt-youtube/RPT_YouTube
        Icon=/usr/share/rpt-youtube/assets/icon.png
        Terminal=false
        Type=Application
        Categories=AudioVideo;
        EOF
        
        # Symlink to /usr/bin
        ln -s /usr/share/rpt-youtube/RPT_YouTube rpt-youtube/usr/bin/rpt-youtube
        
        # Build DEB
        dpkg-deb --build rpt-youtube
    
    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RPT_YouTube_Linux
        path: rpt-youtube.deb

  # =============================================
  # JOB 4: Create GitHub Release
  # =============================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    
    - name: Download Windows Artifact
      uses: actions/download-artifact@v4
      with:
        name: RPT_YouTube_Windows
        path: windows-build
    
    - name: Download Linux Artifact
      uses: actions/download-artifact@v4
      with:
        name: RPT_YouTube_Linux
        path: linux-build
    
    - name: Create Windows ZIP
      run: |
        cd windows-build
        zip -r ../RPT_YouTube_v3.0.0_Windows.zip .
        cd ..
    
    - name: Create Linux ZIP (for backup)
      run: |
        cp linux-build/rpt-youtube.deb .
        zip RPT_YouTube_v3.0.0_Linux.zip rpt-youtube.deb
    
    - name: Create Release Notes
      run: |
        cat > release_notes.md << EOF
        # 🎬 RPT YouTube v3.0.0
        
        ## 🚀 Features
        - ✨ Video Download: 144p to 2160p
        - 🎵 Audio Download: MP3 64-320 kbps
        - 🌙 Dark/Light Themes
        - 🌍 English/Persian Languages
        - 📊 Real-time Progress
        - 📁 Auto Organization (Videos/Musics folders)
        - 📜 Download History
        - ⚙️ Custom Settings
        
        ## 🔧 Improvements
        - Complete UI redesign with customtkinter
        - Auto-dependency installation
        - FFmpeg auto-installation (Windows)
        - Sound notifications
        - Better error handling
        
        ## 🐛 Known Issues
        - Video quality may default to 640p (fix incoming)
        - See [KNOWN_ISSUES.md](KNOWN_ISSUES.md) for details
        
        ## 📥 Downloads
        - **Windows**: RPT_YouTube_v3.0.0_Windows.zip (portable, no install)
        - **Linux**: rpt-youtube.deb (Debian/Ubuntu)
        
        ## 🔗 Links
        - [Source Code](https://github.com/Raptor-1996/RPT-YouTube)
        - [Report Issue](https://github.com/Raptor-1996/RPT-YouTube/issues)
        - [Developer](https://github.com/Raptor-1996)
        
        ---
        **Made with ❤️ by Raptor96**
        EOF
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        name: "RPT YouTube v3.0.0"
        body_path: release_notes.md
        files: |
          RPT_YouTube_v3.0.0_Windows.zip
          rpt-youtube.deb
          RPT_YouTube_v3.0.0_Linux.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =============================================
  # JOB 5: Deploy to GitHub Pages (Documentation)
  # =============================================
  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4
    
    - name: Generate Documentation
      run: |
        mkdir -p docs
        cp README.md docs/index.md
        echo "# RPT YouTube Documentation" > docs/_sidebar.md
        echo "- [Home](/)">> docs/_sidebar.md
        echo "- [Changelog](/changelog)">> docs/_sidebar.md
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs
        publish_branch: gh-pages
        force_orphan: true
        commit_message: "📚 Update documentation"

  # =============================================
  # JOB 6: Notify on Discord (Optional)
  # =============================================
  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [create-release]
    if: startsWith(github.ref, 'refs/tags/') && success()
    
    steps:
    - name: Discord Notification
      uses: Ilshidur/action-discord@master
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      with:
        args: |
          **🎬 RPT YouTube v${{ env.APP_VERSION }} Released!**
          🎉 New version is out!
          📥 Download: https://github.com/Raptor-1996/RPT-YouTube/releases/latest
          👨‍💻 Developer: Raptor96
